name: Formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29
        with:
          stable: true
      - name: Install the release formula
        run: brew install --build-from-source nerdworldDE/tap/codex-accountdeck
      - name: Verify installation
        run: |
          brew test nerdworldDE/tap/codex-accountdeck
          codex-accountdeck --version
          codex-accountdeck --help
